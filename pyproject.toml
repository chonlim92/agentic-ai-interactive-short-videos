[project]
name = "agentic-ai-interactive-short-videos"
version = "0.1.0"
description = "AI agent team for generating interactive episodic animated short videos"
requires-python = ">=3.11"
authors = [{ name = "Chong Kiat Lim" }]
readme = "README.md"

dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20",
    "diffusers>=0.25",
    "transformers>=4.36",
    "accelerate>=0.25",
    "safetensors>=0.4",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "moviepy>=1.0",
    "pydub>=0.25",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# --- Ruff ---
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (prompt strings & templates exceed 100 chars)
    "S101",  # allow assert in tests
    "S110",  # try-except-pass (intentional silent fallbacks in agents)
    "S112",  # try-except-continue (intentional in retry loops)
    "S306",  # suspicious-mktemp (used safely with os.replace)
    "S307",  # suspicious-eval (used for config parsing)
    "S310",  # url-open audit (we open our own API URLs)
    "S311",  # non-crypto random (not used for security)
    "S324",  # insecure hash (used for content fingerprinting, not security)
    "S603",  # subprocess calls (needed for agents)
    "S607",  # partial executable path
    "S608",  # hardcoded-sql (false positive on string formatting)
    "N806",  # uppercase variables in functions (template/config constants)
    "F541",  # f-string-missing-placeholders (template strings used as-is)
    "SIM105",  # contextlib.suppress suggestions (explicit try/except preferred)
    "SIM108",  # ternary suggestions (readability preference)
    "SIM102",  # collapsible-if (readability preference)
    "SIM109",  # compare-with-tuple (readability preference)
    "SIM113",  # enumerate-for-loop (manual index preferred in some contexts)
    "SIM115",  # context-manager-for-open (intentional for logging)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pyright ---
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["agents", "tests"]
exclude = ["**/__pycache__", ".venv", ".video_venv"]
extraPaths = ["agents"]
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportReturnType = "warning"
reportArgumentType = "warning"
reportUndefinedVariable = "warning"
reportPrivateImportUsage = "warning"
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agents"]
addopts = "-v --tb=short"
