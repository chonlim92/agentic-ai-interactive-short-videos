    moderation: auto
  description: A modern programmer, Xiao Xi, finds herself in an ancient Chinese village
    after losing her internet connection. Will she find a way back to the modern world?
  description_zh: 现代程序员小溪在失去网络连接后，意外穿越到了古代中国的一个村庄。她能否找到回到现代世界的方法？
  duration_seconds: 180
  episode_number: 1
  poll:
    deadline_hours: 72
    options:
    - id: a
      label: Explore the village and learn more about the people
      label_zh: 探索村庄，了解更多关于村民的信息
      teaser: Discover the secrets of the ancient village and form bonds with the
        locals.
    - id: b
      label: Try to repair her devices and find a way back to the modern world
      label_zh: 尝试修理设备，寻找回到现代世界的方法
      teaser: Use her technical skills to bridge the gap between past and present.
    - id: c
      label: Seek help from the old craftsman in the village
      label_zh: 向村里的老匠人求助
      teaser: Learn ancient wisdom and see if it can help her solve her modern problems.
    question: What should Xiao Xi do next?
    question_zh: 小溪接下来应该做什么？
